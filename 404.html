     前 12 名链接，点击直达 top-games 对应行（#214 深链 #rank-<appid>）；
     #218 追加「See all Top Games →」收尾链接（SteamDB 榜单全集入口） */

  .e404-sug a:hover, .e404-sug a.kbd-sel { background: rgba(74,222,128,.10); }

  .e404-hw-etitle { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 2px; }

  .e404-hw-btn:hover { border-color: var(--accent); color: var(--accent); }

  .e404-hw-btn.save { background: rgba(74,222,128,.14); border-color: rgba(74,222,128,.4); color: #4ade80; }
  .e404-hw-btn.save:hover { background: rgba(74,222,128,.22); border-color: rgba(74,222,128,.6); }
  .e404-hw-btn.savejudge { background: #4ade80; border-color: #4ade80; color: #06281a; }
  .e404-hw-btn.savejudge:hover { background: #5ff29a; border-color: #5ff29a; color: #06281a; }
  /* #234 ⚡ hover 硬件预览：fixed 元素挂 body（.e404-sug overflow:hidden 会裁剪绝对定位子元素，
     故不可放 li 内）——chip 纵向排列防窄屏横向溢出，长名 ellipsis */

  .e404-toast b { color: #4ade80; font-weight: 700; }
  .e404-sug-thumb { width: 40px; height: 19px; object-fit: cover; border-radius: 3px;
    flex-shrink: 0; background: var(--border); }

  .e404-sug-hot { color: #4ade80; font-size: .7rem; font-weight: 800; margin-left: 6px;

  .e404-sug-hot:hover, .e404-sug-hot:focus-visible { color: #86efac; text-decoration: underline;
    outline: 2px solid rgba(74,222,128,.55); outline-offset: 2px; }
  .e404-sug-hot-v { font-weight: 700; }
  .e404-sug-m { margin-left: auto; color: var(--muted); font-size: .73rem; white-space: nowrap; }
  /* #225 联想无命中空态指引：不再静默收起，给「全库搜索」出口（Steam/Google 式空态） */
  .e404-sug-empty { padding: 12px 14px; color: var(--muted); font-size: .83rem; line-height: 1.5; }
  .e404-sug-empty strong { color: var(--text, #e5e7eb); font-weight: 700; }
  .e404-sug-empty a, .e404-sug-empty .e404-sug-dym a { display: inline-block; padding: 7px 2px; color: #60a5fa; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .e404-sug-empty a:hover, .e404-sug-empty a:focus-visible { color: #86efac; text-decoration: underline; outline: 2px solid rgba(74,222,128,.55); outline-offset: 2px; }
  .e404-sug-empty .e404-sug-dym { margin-top: 5px; font-size: .85rem; color: var(--text); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

<body class="e404-body">
<div class="e404" id="e404-root">
  <div class="e404-search" id="e404-search">
    <div class="e404-code">404</div>
    <h1 id="e404-title">Game not found</h1>
    <p class="desc" id="e404-desc">This page doesn't exist — the link may be outdated. Trying to load it dynamically...</p>
    <form class="e404-form" action="/caniplay/games.html" method="get" role="search">
      <input id="e404-q" type="search" name="q" placeholder="Search 100,000+ games..." autocomplete="off" aria-label="Search games">
      <button type="submit">Search</button>
    </form>
    <div class="e404-links">
      <a href="/caniplay/index.html">🏠 Home</a>
      <a href="/caniplay/games.html">🎮 All Games</a>
      <a href="/caniplay/top-games.html">🔥 Top Games</a>
      <a href="/caniplay/hardware.html">💻 Hardware</a>
    </div>
  </div>
  <div class="dyn-game" id="dyn-game" style="display:none"></div>
</div>
<script>
(function () {
  var root = document.getElementById('e404-root');
  var searchBox = document.getElementById('e404-search');
  var dynBox = document.getElementById('dyn-game');
  var m = (location.pathname.match(/\/([\w-]+)\.html$/) || [])[1];
  if (!m) { return; }
  var slug = decodeURIComponent(m).toLowerCase();
  if (!slug || slug.length > 80) { return; }
  var q = document.getElementById('e404-q');
  if (q) q.value = slug.replace(/[-_]+/g, ' ');

  var first = slug[0];
  if (!/[a-z0-9]/.test(first)) first = '0';
  var shardUrl = '/caniplay/assets/data/lt_' + first + '.json';
  fetch(shardUrl, { cache: 'force-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (list) {
      if (!list) throw new Error('no shard');
      var g = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].u === slug) { g = list[i]; break; }
      }
      if (!g) throw new Error('not in shard');
      render(g);
    })
    .catch(function () {
      document.getElementById('e404-title').textContent = 'Game not found';
      document.getElementById('e404-desc').textContent = "We couldn't find this game in our database. Try searching instead:";
      popFallback(); // #217 无结果时给「热门游戏兜底」（GG.deals 式）
    });

  function esc(v) { return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function txt(a) { return (a || []).map(esc).join(', '); }
  function fld(v) { return (v ? esc(v) : '—'); }
  function osRow(o) { return o ? esc(o) : '—'; }

  function render(g) {
    document.title = g.n + ' — Can I play it on my PC? | CanIPlay';
    document.querySelector('meta[name="description"]').setAttribute('content',
      "Can your PC run " + g.n + "? Check minimum & recommended requirements and get upgrade suggestions.");
    searchBox.style.display = 'none';
    // 成功渲染后隐藏静态"Game not found"标题与说明，避免误导
    var t404 = document.getElementById('e404-title');
    var d404 = document.getElementById('e404-desc');
    if (t404) t404.style.display = 'none';
    if (d404) d404.style.display = 'none';
    dynBox.style.display = 'block';

    // 平台徽章
    var platNames = { steam: 'Steam', epic: 'Epic Games', gog: 'GOG', playstation: 'PS', xbox: 'Xbox', switch: 'Switch', pc: 'PC' };
    var badges = '';
    (g.pts || []).forEach(function (p) {
      badges += '<span class="platform-badge pb-' + esc(p) + '">' + esc(platNames[p] || p) + '</span>';
    });
    var sale = g.di > 0 ? '<span class="sale-badge">-' + g.di + '%</span>' : '';
    var price = '';
    if (g.f) price = '<span class="sale-badge">Free</span>';
    else if (g.p > 0) {
      var orig = g.di > 0 ? Math.round(g.p / (1 - g.di / 100)) : g.p;
      price = '$' + (g.p / 100).toFixed(2) + (g.di > 0 ? ' <span class="sale-badge">-' + g.di + '%</span>' : '');
    }
    var company = (g.dv && g.dv.length) || (g.pu && g.pu.length)
      ? '<p class="company">🏢 ' + txt(g.dv) + ' · ' + txt(g.pu) + '</p>' : '';
    var franchise = g.fr ? '<p class="franchise">🔗 Series: ' + esc(g.fr) + '</p>' : '';
    var metaDate = g.dt ? esc(g.dt) : '';

    // 截图区
    var media = '';
    if (g.ss && g.ss.length) {
      media = '<div class="media-section"><h3>📸 Screenshots</h3><div class="ss-grid">' +
        g.ss.slice(0, 4).map(function (s) { return '<a class="ss-item" href="' + esc(s) + '" target="_blank" rel="noopener"><img src="' + esc(s) + '" loading="lazy" alt="' + esc(g.n) + ' screenshot"></a>'; }).join('') +
        '</div></div>';
    }
    // DLC
    var dlc = '';
    if (g.dl && g.dl.length) {
      dlc = '<div class="media-section dlc-section"><h3>🎁 DLC &amp; Add-ons</h3><div class="dlc-list">' +
        g.dl.map(function (d) {
          var pt = d.p === 0 ? '<span class="dlc-price free">Free</span>'
            : (d.p > 0 && d.p <= 20000 ? '<span class="dlc-price">$' + (d.p / 100).toFixed(2) + '</span>' : '');
          return '<a class="dlc-item" href="https://store.steampowered.com/app/' + esc(d.d) + '" target="_blank" rel="noopener">' +
            '<span class="dlc-thumb-ph"></span><span class="dlc-name">' + esc(d.n) + '</span>' + pt + '</a>';
        }).join('') + '</div></div>';
    }
    // 新闻
    var news = '';
    if ((g.nw || []).length) {
      news = '<div class="media-section"><h3>📰 Latest News</h3><ul class="news-list">' +
        g.nw.map(function (nw) { return '<li><a href="' + esc(nw.u) + '" target="_blank" rel="noopener">' + esc(nw.t) + '</a> <span class="row-genres">' + esc(nw.d) + ' · ' + esc(nw.s) + '</span></li>'; }).join('') +
        '</ul></div>';
    }

<script>
(function () {

  function checkQs() {

    document.body.removeChild(ta);
  }
  // #222 复制绝对 /caniplay/game/<slug>.html 链接（#226 判定参数转发；#233 升级为 judgeQS——
  // URL 显式参数优先、回落已存 My PC 合成，#45 分享判定链接可复制直达）；data-slug 与锚同源零分裂
  function copyLink(btn) {
    var slug = btn.getAttribute('data-slug');
    var url = location.origin + '/caniplay/game/' + slug + '.html' + judgeQS;
    function done() {
      btn.classList.add('copied');
      setTimeout(function () { btn.classList.remove('copied'); }, 1300);
      toast('Link copied: <b>' + esc(slug) + '</b>');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { legacyCopy(url); done(); });
    } else { legacyCopy(url); done(); }
  }
  // 页面预填（不存在游戏的 slug 已把 q 填成游戏名）→ 载入即联想
  if (q.value && q.value.trim()) setTimeout(function () { run(q.value); }, 260);
  loadHot(); // #221 预载 rankmap 热门榜（联想热门置顶 + #N now 角标数据源）
  loadPages(); // #239 预载 pages.json 静态判定页清单（⚡/Save&judge 门控数据源）

  // ================= #237 ⚡ hover chips 可点击「Edit My PC」内联编辑器（CYRI hover 卡式） =================
  // hover ⚡ 预览将用于判定的硬件（#234）→ 点 chips 或 ✏️ Edit → 内联编辑已存 My PC →
  // 保存写回 caniplay_hw（#26/#32 同 key 同格式 {gpu,cpu,ram}）→ judgeQS 重算为新值 →
  // ⚡/复制立即用新硬件（hwEdited 使已存新值优先于 URL 参数，显式编辑=最新意图）。
  var hwEdEl = null, hwEdGpu = null, hwEdCpu = null, hwEdRam = null, hwEdErr = null, hwEdSlug = '';
  function ensureHwEditor() {
    if (hwEdEl) return hwEdEl;
    hwEdEl = document.createElement('div');
    hwEdEl.className = 'e404-hw-editor';
    hwEdEl.setAttribute('role', 'dialog');
    hwEdEl.setAttribute('aria-modal', 'true');
    hwEdEl.innerHTML =
      '<div class="e404-hw-ecard">' +
        '<div class="e404-hw-etitle">Edit My PC</div>' +
        '<div class="e404-hw-ecsub">Used by ⚡ quick checks on this page — saved to this browser.</div>' +
        '<div class="e404-hw-efield"><label for="e404-hw-gpu">GPU</label>' +
          '<input id="e404-hw-gpu" type="text" autocomplete="off" list="e404-hw-gpu-list" placeholder="e.g. NVIDIA GeForce RTX 3060"></div>' +
        '<datalist id="e404-hw-gpu-list"></datalist>' +
        '<div class="e404-hw-efield"><label for="e404-hw-cpu">CPU</label>' +
          '<input id="e404-hw-cpu" type="text" autocomplete="off" list="e404-hw-cpu-list" placeholder="e.g. Intel Core i5-12400F"></div>' +
        '<datalist id="e404-hw-cpu-list"></datalist>' +
        '<div class="e404-hw-efield"><label for="e404-hw-ram">RAM</label>' +
          '<select id="e404-hw-ram"></select></div>' +
        '<div class="e404-hw-err" role="alert"></div>' +
        '<div class="e404-hw-eacts">' +
          '<button type="button" class="e404-hw-btn cancel" data-act="cancel">Cancel</button>' +
          '<button type="button" class="e404-hw-btn save" data-act="save">Save</button>' +
          '<button type="button" class="e404-hw-btn savejudge" data-act="savejudge" title="Save and check this game with your PC">Save &amp; judge</button>' +
        '</div>' +
      '</div>';
    var sel = hwEdEl.querySelector('#e404-hw-ram');
    [4, 8, 16, 32, 64].forEach(function (v) {
      var o = document.createElement('option');
      o.value = String(v); o.textContent = v + ' GB';
      sel.appendChild(o);
    });
    hwEdGpu = hwEdEl.querySelector('#e404-hw-gpu');
    hwEdCpu = hwEdEl.querySelector('#e404-hw-cpu');
    hwEdRam = sel;
    hwEdErr = hwEdEl.querySelector('.e404-hw-err');
    document.body.appendChild(hwEdEl);
    // 事件在元素创建后绑定（防 IIFE 初始化期绑 null 中止整段脚本）；遮罩点击=关闭
    hwEdEl.addEventListener('click', function (ev) {
      if (ev.target === hwEdEl) { closeHwEditor(); return; }
      var a = ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!a) return;
      if (a.getAttribute('data-act') === 'save') saveHw(false);
      else if (a.getAttribute('data-act') === 'savejudge') saveHw(true);
      else if (a.getAttribute('data-act') === 'cancel') closeHwEditor();
    });
    return hwEdEl;
  }
  function openHwEditor() {
    var ed = ensureHwEditor();
    loadHwSuggest(); // #244 首次打开即拉补全数据源（懒加载，只拉一次）
    hwEdSlug = hwTipSlug || '';
    // Save & judge 只在有目标游戏（⚡ 来源行）时可用；无来源（非 tooltip 打开）隐藏
    var sj = ed.querySelector('.e404-hw-btn.savejudge');
    if (sj) sj.style.display = hwEdSlug ? '' : 'none';
    // 预填当前将用于判定的硬件（judgeQS = URL 参数优先/回落已存 My PC，与 ⚡ 同源零分裂）
    var hw = hwPreview() || {};
    hwEdGpu.value = hw.gpu || '';
    hwEdCpu.value = hw.cpu || '';
    hwEdErr.textContent = '';
    var cur = String(hw.ram || '16');
    if (!/^\d+$/.test(cur)) cur = '16';
    var exists = Array.prototype.some.call(hwEdRam.options, function (o) { return o.value === cur; });
    if (!exists) {
      var o = document.createElement('option');
      o.value = cur; o.textContent = cur + ' GB';
      hwEdRam.appendChild(o);
    }
    hwEdRam.value = cur;
    ed.classList.add('show');
    hide();      // 收起联想列表（编辑器全屏遮罩覆盖）
    hideHwTip(); // 收起 ⚡ 预览 tooltip
    setTimeout(function () { hwEdGpu.focus(); }, 30);
  }
  function closeHwEditor() {
    if (hwEdEl) hwEdEl.classList.remove('show');
  }
  function saveHw(go) {
    var g = hwEdGpu.value.trim(), c = hwEdCpu.value.trim();
    if (!g && !c) {
      hwEdErr.textContent = 'Enter at least a GPU or CPU name to check.';
      return;
    }
    try { localStorage.setItem('caniplay_hw', JSON.stringify({ gpu: g, cpu: c, ram: hwEdRam.value })); } catch (e) {}
    hwEdited = true;
    refreshJudgeQS();
    closeHwEditor();
    // #238 Save & judge：保存后带新硬件直达该行游戏判定页（hwEdited 使已存新值优先于 URL 参数）
    // #239 门控：清单已载入且目标无静态判定页 → 回落 plain Save（不导航到无判定面板的动态页）
    if (go && hwEdSlug && pagesHas(hwEdSlug)) {
      location.href = '/caniplay/game/' + hwEdSlug + '.html' + judgeQS;
      return;
    }
    toast('My PC updated — ⚡ checks now use your <b>new hardware</b>');
  }
  // tooltip 挂 body（非 list 内），chips/✏️ Edit 点击用 document 委托（行重渲染不受影响）
  document.addEventListener('click', function (ev) {
    if (!ev.target || !ev.target.closest) return;
    var t = ev.target.closest('.e404-hw-chip, .e404-hw-edit');
    if (t) { ev.preventDefault(); openHwEditor(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && hwEdEl && hwEdEl.classList.contains('show')) closeHwEditor();
  });
})();
</script>
</body>
</html>
